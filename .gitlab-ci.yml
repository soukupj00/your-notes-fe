stages:
  - quality
  - test
  - build
  - secret-detection

variables:
  PNPM_STORE_PATH: .pnpm-store
  NODE_VERSION: "22"
  SECRET_DETECTION_ENABLED: "true"


# ─── Security (keep existing templates) ───────────────────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: quality

secret_detection:
  stage: secret-detection

# ─── Shared setup ─────────────────────────────────────────────────────────────
.pnpm-setup: &pnpm-setup
  image: node:22-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push

# ─── Quality ──────────────────────────────────────────────────────────────────
lint:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm check:ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

eslint:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

typecheck:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm exec tsc -b --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Tests ────────────────────────────────────────────────────────────────────
test:unit:
  <<: *pnpm-setup
  stage: test
  script:
    - pnpm test --run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:e2e:
  # Not the shared *pnpm-setup: Playwright needs its browsers and their system
  # libraries, and node:22-alpine has neither. The official image ships both, so
  # the version here must be kept in step with @playwright/test in package.json
  # or the browsers on disk will not be the ones the runner asks for.
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  stage: test
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull
  script:
    - pnpm test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Build ────────────────────────────────────────────────────────────────────
build:
  <<: *pnpm-setup
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Container publishing remains deferred until the app has a deployment target.
