stages:
  - quality
  - test
  - build
  - publish
  - secret-detection

variables:
  PNPM_STORE_PATH: .pnpm-store
  NODE_VERSION: "22"
  SECRET_DETECTION_ENABLED: "true"
  IMAGE: $CI_REGISTRY_IMAGE


# ─── Security (keep existing templates) ───────────────────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: quality

secret_detection:
  stage: secret-detection

# ─── Shared setup ─────────────────────────────────────────────────────────────
.pnpm-setup: &pnpm-setup
  image: node:22-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push

# ─── Quality ──────────────────────────────────────────────────────────────────
lint:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm check:ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

eslint:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

typecheck:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm exec tsc -b --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Tests ────────────────────────────────────────────────────────────────────
test:unit:
  <<: *pnpm-setup
  stage: test
  script:
    - pnpm test --run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:e2e:
  # Not the shared *pnpm-setup: Playwright needs its browsers and their system
  # libraries, and node:22-alpine has neither. The official image ships both, so
  # the version here must be kept in step with @playwright/test in package.json
  # or the browsers on disk will not be the ones the runner asks for.
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  stage: test
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull
  script:
    - pnpm test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Build ────────────────────────────────────────────────────────────────────
build:
  <<: *pnpm-setup
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# The image is self-contained (the Dockerfile runs its own pnpm build); the backend
# builds FROM it and copies /usr/share/nginx/html (ADR 0006, backend ADR 0004).
build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Runs the image just built and asks it for / and a client route, expecting the
# app's HTML. Needs a runner that allows the docker:dind service (privileged).
test:smoke:
  stage: build
  needs: [build:image]
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  allow_failure: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run -d --name younotes-fe -p 8080:80 "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - for i in $(seq 1 30); do wget -q -O - http://docker:8080/ | grep -q '<title>YouNotes</title>' && break; sleep 1; done
    - wget -q -O - http://docker:8080/settings | grep -q '<title>YouNotes</title>' || { docker logs younotes-fe; exit 1; }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- Publish ---
# Retags the tested image: `latest` from the default branch, the git tag (v0.x.y) from a tag.
.publish: &publish
  stage: publish
  needs: [build:image, test:smoke]
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$PUBLISH_TAG"

publish:latest:
  <<: *publish
  variables:
    PUBLISH_TAG: latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:release:
  <<: *publish
  variables:
    PUBLISH_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
