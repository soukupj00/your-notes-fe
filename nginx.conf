# Standalone image: serves the built PWA and falls back to index.html so client routes load.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri /index.html;
    }

    # A missing hashed chunk must 404, not return index.html to a stale service worker.
    location /assets/ {
        try_files $uri =404;
    }
}
