# Which dependencies may run install-time build scripts (pnpm 11 `allowBuilds`).
# Left as an unfilled scaffold until now, which made any commit touching
# package.json fail the husky hook.
allowBuilds:
  # Real build-time native deps: the Tailwind oxide engine and esbuild both
  # need their platform binary in place for `vite build` to work.
  '@tailwindcss/oxide': true
  esbuild: true
  # Transitive test-tooling only (canvas via jsdom, sqlite3 via indexeddbshim).
  # Neither is built today and the whole suite passes, so compiling them on
  # every install would buy nothing.
  canvas: false
  sqlite3: false
minimumReleaseAgeExclude:
  - nanoid@3.3.8 || 3.3.16 || 3.3.18 || 5.0.9 || 5.1.6 || 5.1.16
  - minimatch@5.1.7 || 5.1.8
  - ajv@8.18.0
  - brace-expansion@2.0.3 || 2.1.2 || 2.1.3 || 2.1.4 || 5.0.9
  - lodash-es@4.17.23 || 4.17.24
  - '@babel/plugin-transform-modules-systemjs@7.29.4'
  - fast-uri@3.1.1 || 3.1.2 || 3.1.3 || 3.1.4 || 3.1.5
  - mermaid@11.16.1
  - dompurify@3.4.13
# Security patches for transitive deps that upstream (workbox-build via
# vite-plugin-pwa, @excalidraw/mermaid-to-excalidraw) have not bumped yet.
# `pnpm audit` is the source of truth; drop an entry once upstream catches up.
overrides:
  '@babel/plugin-transform-modules-systemjs@<7.29.4': ^7.29.4
  ajv@>=7 <8.18.0: ^8.18.0
  brace-expansion@>=2 <2.1.4: ^2.1.4
  fast-uri@>=3 <3.1.5: ^3.1.5
  lodash-es@<4.17.24: ^4.17.24
  minimatch@>=5 <5.1.8: ^5.1.8
  nanoid@<3.3.18: ^3.3.18
  nanoid@>=4 <5.1.16: ^5.1.16
